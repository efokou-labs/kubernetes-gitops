apiVersion: apps/v1
kind: Deployment
metadata:
  name: career-workspace-worker
spec:
  replicas: 1
  selector:
    matchLabels:
      app: career-workspace-worker
  template:
    metadata:
      labels:
        app: career-workspace-worker
    spec:
      containers:
        - name: worker
          image: ghcr.io/efokou-labs/career-workspace:dev
          command: ["python", "-m", "app.worker"]
          env:
            - name: DATABASE_URL
              valueFrom:
                secretKeyRef:
                  name: career-workspace-db
                  key: DATABASE_URL
            - name: REDIS_URL
              value: redis://career-workspace-redis:6379/0
          resources:
            requests:
              cpu: 25m
              memory: 64Mi
            limits:
              cpu: 250m
              memory: 256Mi
