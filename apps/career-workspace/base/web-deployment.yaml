apiVersion: apps/v1
kind: Deployment
metadata:
  name: career-workspace-web
spec:
  replicas: 1
  selector:
    matchLabels:
      app: career-workspace-web
  template:
    metadata:
      labels:
        app: career-workspace-web
    spec:
      containers:
        - name: web
          image: ghcr.io/efokou-labs/career-workspace-web:dev
          ports:
            - containerPort: 3000
          env:
            - name: API_URL
              value: http://career-workspace
          livenessProbe:
            httpGet:
              path: /
              port: 3000
          readinessProbe:
            httpGet:
              path: /
              port: 3000
          resources:
            requests:
              cpu: 50m
              memory: 128Mi
            limits:
              cpu: 500m
              memory: 512Mi
