apiVersion: apps/v1
kind: Deployment
metadata:
  name: askel
spec:
  template:
    spec:
      initContainers:
        - name: wait-postgres
          image: busybox:1.36
          command:
            - sh
            - -c
            - until nc -z askel-postgres 5432; do sleep 1; done
      containers:
        - name: app
          env:
            - name: DATABASE_URL
              valueFrom:
                secretKeyRef:
                  name: askel-db
                  key: DATABASE_URL
            - name: REDIS_URL
              value: redis://askel-redis:6379/0
