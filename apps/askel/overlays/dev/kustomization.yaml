apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
namespace: askel
resources:
  - ../../base
  - namespace.yaml
  - secret.yaml
  - postgres.yaml
  - redis.yaml
  - worker.yaml
patches:
  - path: api-env.yaml
replicas:
  - name: askel
    count: 1
  - name: askel-web
    count: 1
images:
  - name: ghcr.io/efokou-labs/askel
    newTag: dev
  - name: ghcr.io/efokou-labs/askel-web
    newTag: dev
