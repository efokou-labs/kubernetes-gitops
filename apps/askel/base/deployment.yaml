apiVersion: apps/v1
kind: Deployment
metadata:
  name: askel
spec:
  replicas: 1
  selector:
    matchLabels:
      app: askel
  template:
    metadata:
      labels:
        app: askel
    spec:
      containers:
        - name: app
          image: ghcr.io/efokou-labs/askel:dev
          ports:
            - containerPort: 8080
          livenessProbe:
            httpGet:
              path: /healthz
              port: 8080
          readinessProbe:
            httpGet:
              path: /readyz
              port: 8080
          resources:
            requests:
              cpu: 50m
              memory: 64Mi
            limits:
              cpu: 500m
              memory: 256Mi
