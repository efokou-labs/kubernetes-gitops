name: gitops

on:
  pull_request:
  push:
    branches: [main]

jobs:
  kustomize:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install kustomize
        run: |
          curl -sL https://github.com/kubernetes-sigs/kustomize/releases/download/kustomize%2Fv5.4.3/kustomize_v5.4.3_linux_amd64.tar.gz | tar xz
          sudo mv kustomize /usr/local/bin/
      - name: Install kubeconform
        run: |
          curl -sL https://github.com/yannh/kubeconform/releases/download/v0.6.7/kubeconform-linux-amd64.tar.gz | tar xz
          sudo mv kubeconform /usr/local/bin/
      - name: build overlays
        run: |
          set -euo pipefail
          for p in apps/*/overlays/*; do
            echo "BUILD $p"
            kustomize build "$p" | kubeconform -strict -ignore-missing-schemas
          done
          kustomize build apps/root | kubeconform -strict -ignore-missing-schemas
